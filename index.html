<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Home</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ===== Navbar ===== -->
    <header class="navbar">
        <div class="logo">ShopEase</div>
        <nav>
            <ul>
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== Hero Section ===== -->
    <section class="hero">
        <div class="hero-content">
            <h1>Level Up Your Style</h1>
            <p>Discover exclusive deals on trending products.</p>
            <a href="shop.html" class="btn">Explore Collection</a>
        </div>
    </section>

    <!-- ===== Featured Categories / Products ===== -->
    <section class="featured">
        <h2>Trending Now</h2>
        <div class="product-grid">

            <div class="product-card">
                <img src="assets/images/product1.jpg" alt="Product 1">
                <h3>Wireless Earbuds</h3>
                <p>₹1,299</p>
            </div>

            <div class="product-card">
                <img src="assets/images/product2.jpg" alt="Product 2">
                <h3>Smart Fitness Band</h3>
                <p>₹1,999</p>
            </div>

            <div class="product-card">
                <img src="assets/images/product3.jpg" alt="Product 3">
                <h3>Bluetooth Speaker</h3>
                <p>₹2,499</p>
            </div>

        </div>
    </section>

    <!-- ===== Footer ===== -->
    <footer>
        <p>© 2025 ShopEase.</p>
    </footer>

</body>
</html>
