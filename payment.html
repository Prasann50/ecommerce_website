<!DOCTYPE html>
<html lang="en">
<style>
    body {
        margin: 0;
        background-color: #121212;
        color: #fff;
        font-family: 'Poppins', sans-serif;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 50px;
        background-color: #1f1f1f;
    }

    .navbar .logo {
        font-size: 1.8rem;
        color: #00f7ff;
        font-weight: 700;
    }

    .navbar nav ul {
        list-style: none;
        display: flex;
        gap: 20px;
    }

    .navbar nav ul li a {
        text-decoration: none;
        color: #ccc;
        transition: 0.3s;
    }

    .navbar nav ul li a.active,
    .navbar nav ul li a:hover {
        color: #00f7ff;
    }

    .payment-section {
        max-width: 500px;
        margin: 50px auto;
        background-color: #1f1f1f;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
    }

    .payment-section h2 {
        text-align: center;
        color: #00f7ff;
        margin-bottom: 20px;
    }

    #order-summary h3 {
        margin-bottom: 10px;
        color: #00f7ff;
    }

    .payment-section form {
        display: flex;
        flex-direction: column;
    }

    .payment-section input {
        margin-bottom: 15px;
        padding: 10px 15px;
        border: none;
        border-radius: 6px;
        background-color: #2c2c2c;
        color: #fff;
    }

    .payment-section button {
        background-color: #00b0ff;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
    }

    .payment-section button:hover {
        background-color: #0091ea;
        transform: translateY(-2px);
    }

    #payment-success {
        text-align: center;
        margin-top: 20px;
    }

    #payment-success h3 {
        color: #00e676;
    }

    .home-btn {
        display: inline-block;
        margin-top: 15px;
        padding: 10px 25px;
        background-color: #00c853;
        color: #fff;
        border-radius: 25px;
        text-decoration: none;
        transition: 0.3s;
    }

    .home-btn:hover {
        background-color: #009624;
        transform: translateY(-2px);
    }

    footer {
        text-align: center;
        padding: 20px;
        background-color: #1f1f1f;
        margin-top: 40px;
        color: #888;
    }
</style>

<head>
    <meta charset="UTF-8">
    <title>ShopEase - Payment</title>

</head>

<body>

    <!-- ===== Navbar ===== -->
    <header class="navbar">
        <div class="logo">ShopEase</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ===== Payment Section ===== -->
    <section class="payment-section">
        <h2>Payment Details 💳</h2>
        <div id="order-summary"></div>

        <form id="paymentForm">
            <input type="text" placeholder="Cardholder Name" required>
            <input type="text" placeholder="Card Number" maxlength="16" required>
            <input type="text" placeholder="Expiry Date (MM/YY)" required>
            <input type="text" placeholder="CVV" maxlength="3" required>
            <button type="submit">Confirm Payment</button>
        </form>

        <div id="payment-success" style="display:none;">
            <h3>✅ Payment Successful!</h3>
            <p>Thank you for shopping with ShopEase.</p>
            <a href="index.html" class="home-btn">Return to Home</a>
        </div>
    </section>

    <footer>
        <p>© 2025 ShopEase</p>
    </footer>

    <script>
        function loadOrderSummary() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const summaryDiv = document.getElementById('order-summary');
            summaryDiv.innerHTML = '';

            if (cart.length === 0) {
                summaryDiv.innerHTML = '<p>Your cart is empty. Nothing to pay for.</p>';
                document.getElementById('paymentForm').style.display = 'none';
                return;
            }

            let total = 0;
            summaryDiv.innerHTML = '<h3>Order Summary:</h3>';
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                summaryDiv.innerHTML += `
                    <p>${item.name} x ${item.quantity} - ₹${itemTotal}</p>
                `;
            });

            summaryDiv.innerHTML += `<p><strong>Total: ₹${total}</strong></p>`;
        }

        document.getElementById('paymentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            localStorage.removeItem('cart');
            document.getElementById('paymentForm').style.display = 'none';
            document.getElementById('payment-success').style.display = 'block';
        });

        window.onload = loadOrderSummary;
    </script>

</body>

</html>
